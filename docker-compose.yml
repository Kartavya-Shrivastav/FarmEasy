version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672
    depends_on:
      - rabbitmq
      - redis
    networks:
      - farmeasy-network

  notification-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file:
      - ./backend/.env
    environment:
      - RABBITMQ_URL=amqp://admin:password@rabbitmq:5672
    depends_on:
      - rabbitmq
    networks:
      - farmeasy-network

  rabbitmq:
    image: rabbitmq:3.12-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - farmeasy-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - farmeasy-network

volumes:
  rabbitmq-data:
  redis-data:

networks:
  farmeasy-network:
    driver: bridge